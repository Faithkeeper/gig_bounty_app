name: gig_bounty_app
description: "GigBounty - Community Micro-Task & Skills Exchange Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design Icons
  cupertino_icons: ^2.0.0

  # Firebase Suite (Phases 2 - 8)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1

  # SQLite Local Database (Phase 7)
  sqflite: ^2.3.2
  path: ^1.9.0

  # Helper Utilities
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true